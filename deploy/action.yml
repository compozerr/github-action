name: 'Deploy with Compozerr'
description: 'Deploy your project to Compozerr'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  token:
    description: 'Compozerr API token (cmpz_ prefix). Not required if setup action was already used.'
    required: false
  environment:
    description: 'Environment name to deploy to (defaults to production)'
    required: false
  wait:
    description: 'Wait for deployment to complete (default: false)'
    required: false
    default: 'false'
  wait-timeout:
    description: 'Timeout in seconds when waiting for deployment (default: 600)'
    required: false
    default: '600'
  poll-interval:
    description: 'Status poll interval in seconds when waiting (default: 10)'
    required: false
    default: '10'
  working-directory:
    description: 'Directory containing compozerr.json (default: .)'
    required: false
    default: '.'

outputs:
  deployment-id:
    description: 'ID of the created deployment'
    value: ${{ steps.deploy.outputs.deployment-id }}
  status-url:
    description: 'URL to check deployment status'
    value: ${{ steps.deploy.outputs.status-url }}
  status:
    description: 'Final deployment status'
    value: ${{ steps.deploy.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Install Compozerr CLI (if not already installed)
      if: ${{ inputs.token != '' }}
      shell: bash
      run: |
        if ! command -v compozerr &> /dev/null; then
          /bin/bash -c "$(curl -fsSL https://compozerr.com/install.sh)"
          echo "$HOME/.local/compozerr-bin" >> "$GITHUB_PATH"
        fi

    - name: Authenticate (if token provided)
      if: ${{ inputs.token != '' }}
      shell: bash
      env:
        COMPOZERR_TOKEN: ${{ inputs.token }}
      run: compozerr login --token "$COMPOZERR_TOKEN"

    - name: Check CLI is available
      shell: bash
      run: |
        if ! command -v compozerr &> /dev/null; then
          echo "::error::Compozerr CLI not found. Either provide 'token' input or use compozerr/github-action/setup first."
          exit 1
        fi

    - name: Ensure checkout matches workflow ref
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ -z "${GITHUB_SHA:-}" ]; then
          exit 0
        fi

        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          exit 0
        fi

        CURRENT_SHA=$(git rev-parse HEAD)
        if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
          echo "::warning title=Correcting deploy checkout::The repository is checked out at $CURRENT_SHA, but this workflow was triggered for $GITHUB_SHA. Checking out the triggering ref before deploying."

          if [ -n "${GITHUB_REF:-}" ]; then
            git fetch --force --depth=1 origin "+${GITHUB_REF}:${GITHUB_REF}" || true
          fi
          git fetch --force --depth=1 origin "$GITHUB_SHA" || true

          if ! git checkout --force --detach "$GITHUB_SHA"; then
            echo "::error::Unable to check out the triggering commit $GITHUB_SHA. Remove any checkout 'ref:' override or fetch the triggering ref before running compozerr/github-action/deploy."
            exit 1
          fi
        fi

        UPDATED_SHA=$(git rev-parse HEAD)
        if [ "$UPDATED_SHA" != "$GITHUB_SHA" ]; then
          echo "::error::Checkout correction failed: expected $GITHUB_SHA but found $UPDATED_SHA."
          exit 1
        fi

        if git symbolic-ref -q HEAD >/dev/null 2>&1; then
          exit 0
        fi

        if [ -n "${GITHUB_REF_NAME:-}" ]; then
          REF_NAME="$GITHUB_REF_NAME"
        else
          REF_NAME="${GITHUB_SHA:0:12}"
        fi

        if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
          DEPLOY_BRANCH="compozerr-deploy-${REF_NAME}"
        else
          DEPLOY_BRANCH="$REF_NAME"
        fi

        DEPLOY_BRANCH=$(printf '%s' "$DEPLOY_BRANCH" | tr -c 'A-Za-z0-9._/-' '-')
        git update-ref "refs/remotes/origin/${DEPLOY_BRANCH}" "$GITHUB_SHA"
        git checkout --force -B "$DEPLOY_BRANCH" "$GITHUB_SHA"
        git config "branch.${DEPLOY_BRANCH}.remote" origin
        git config "branch.${DEPLOY_BRANCH}.merge" "refs/heads/${DEPLOY_BRANCH}"

    - name: Deploy
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_WAIT: ${{ inputs.wait }}
        DEPLOY_TIMEOUT: ${{ inputs.wait-timeout }}
        DEPLOY_POLL_INTERVAL: ${{ inputs.poll-interval }}
      run: |
        set -o pipefail

        # Dump deployment logs as a collapsible group. Best-effort — never fails
        # the script itself; logs may be unavailable if the deployment was never
        # accepted by the backend.
        dump_logs() {
          local deployment_id="$1"
          if [ -z "$deployment_id" ]; then
            return 0
          fi
          echo "::group::Deployment logs (compozerr deployment logs $deployment_id)"
          local logs_output
          logs_output=$(compozerr deployment logs "$deployment_id" --json --non-interactive 2>&1) || true
          # Try to format as "timestamp [level] message". Fall back to raw output.
          if echo "$logs_output" | jq -e '.data.logs' >/dev/null 2>&1; then
            echo "$logs_output" \
              | jq -r '.data.logs[]? | "\(.timestamp) [\(.level)] \(.message)"' \
              || echo "$logs_output"
          else
            echo "$logs_output"
          fi
          echo "::endgroup::"
        }

        ARGS="--non-interactive --json"
        if [ -n "$DEPLOY_ENVIRONMENT" ]; then
          ARGS="$ARGS -e $DEPLOY_ENVIRONMENT"
        fi

        # Initiate deployment (never use --wait here — we poll ourselves so we
        # can log progress and auto-dump logs on failure).
        echo "Starting deployment..."
        OUTPUT=$(compozerr deploy $ARGS 2>&1) || {
          echo "::error::Failed to initiate deployment"
          echo "$OUTPUT"
          exit 1
        }

        echo "$OUTPUT"

        # Older CLI versions emit {"success": false, ...} but exit 0.
        # Use `tostring` to distinguish false from null/missing — `// empty` would coerce both.
        SUCCESS=$(echo "$OUTPUT" | jq -r '.success | tostring' 2>/dev/null || echo "")
        if [ "$SUCCESS" = "false" ]; then
          ERROR_MSG=$(echo "$OUTPUT" | jq -r '.error.message // "Deployment failed"' 2>/dev/null || echo "Deployment failed")
          echo "::error::Deployment failed: $ERROR_MSG"
          # No deployment was created — nothing to fetch logs for.
          exit 1
        fi

        # Parse deployment metadata. CLI v0.2.x emits { success, data: { projectId, statusUrl, ... } }.
        # Fall back to top-level fields for older CLI versions.
        PROJECT_ID=$(echo "$OUTPUT" | jq -r '.data.projectId // .projectId // empty' 2>/dev/null || true)
        STATUS_URL=$(echo "$OUTPUT" | jq -r '.data.statusUrl // .statusUrl // empty' 2>/dev/null || true)

        DEPLOYMENT_ID=""
        if [ -n "$STATUS_URL" ]; then
          DEPLOYMENT_ID=$(echo "$STATUS_URL" | sed -nE 's|.*/deployments/([a-f0-9-]+).*|\1|p' | head -1)
        fi

        echo "deployment-id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
        echo "status-url=${STATUS_URL}" >> "$GITHUB_OUTPUT"

        if [ -n "$STATUS_URL" ]; then
          echo ""
          echo "Your application is currently building..."
          echo "Track deployment status: $STATUS_URL"
          echo ""
          echo "::notice title=Compozerr deployment::Track progress at $STATUS_URL"
        fi

        if [ "$DEPLOY_WAIT" != "true" ]; then
          echo "status=initiated" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$DEPLOYMENT_ID" ]; then
          echo "::error::wait=true was requested but no deployment ID could be derived from the CLI response. Cannot poll status."
          exit 1
        fi

        # CLI does the polling now — `compozerr deployment status --wait` blocks
        # until the deployment reaches a terminal state, emitting status
        # transitions to stderr (which surfaces in the action log naturally).
        echo "Waiting for deployment to complete (timeout: ${DEPLOY_TIMEOUT}s, poll: ${DEPLOY_POLL_INTERVAL}s)..."

        WAIT_OUTPUT_FILE=$(mktemp)
        if compozerr deployment status "$DEPLOYMENT_ID" \
            --wait \
            --timeout "$DEPLOY_TIMEOUT" \
            --poll-interval "$DEPLOY_POLL_INTERVAL" \
            --json \
            --non-interactive \
            > "$WAIT_OUTPUT_FILE"; then
          # Exit 0 = Completed
          echo "::notice::Deployment completed successfully"
          echo "status=Completed" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Exit non-zero = Failed / Cancelled / Timeout. CLI prints the JSON error
        # response to the file we redirected stdout to.
        WAIT_OUTPUT=$(cat "$WAIT_OUTPUT_FILE")
        rm -f "$WAIT_OUTPUT_FILE"

        ERROR_CODE=$(echo "$WAIT_OUTPUT" | jq -r '.error.code // empty' 2>/dev/null || echo "")
        ERROR_MSG=$(echo "$WAIT_OUTPUT" | jq -r '.error.message // "Deployment did not complete"' 2>/dev/null || echo "Deployment did not complete")

        case "$ERROR_CODE" in
          "DEPLOYMENT_TIMEOUT")
            echo "::warning::$ERROR_MSG"
            dump_logs "$DEPLOYMENT_ID"
            echo "::notice::Track at: $STATUS_URL"
            echo "status=timeout" >> "$GITHUB_OUTPUT"
            # Treat timeout as non-fatal: deployment may still complete out-of-band.
            exit 0
            ;;
          "DEPLOYMENT_FAILED")
            # CLI's message is "Deployment failed." or "Deployment cancelled."
            FINAL_STATUS="Failed"
            if echo "$ERROR_MSG" | grep -qi 'cancelled'; then
              FINAL_STATUS="Cancelled"
            fi
            echo "::error::Deployment $FINAL_STATUS: $ERROR_MSG"
            dump_logs "$DEPLOYMENT_ID"
            echo "::notice::View full deployment: $STATUS_URL"
            echo "status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"
            exit 1
            ;;
          *)
            echo "::error::Deployment wait failed: $ERROR_MSG"
            echo "$WAIT_OUTPUT"
            dump_logs "$DEPLOYMENT_ID"
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            exit 1
            ;;
        esac
